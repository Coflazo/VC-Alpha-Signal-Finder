id: earlybird
name: Earlybird Venture Capital
url: https://earlybird.com

prose: >
  We invest pre-seed to Series A across Europe, and we like to move before a category
  is widely understood or even exists. Fund VIII focuses on AI applications, software
  infrastructure, foundation models and deep tech. We are willing to spend real time
  upfront understanding a technology, its customers and its market dynamics, which
  means we are comfortable with companies that are hard to categorise today. Separate
  vehicles cover Western Europe, Emerging Europe, and health.

founder_voice: >
  I'm building something at the infrastructure or deep tech layer and it's genuinely
  hard to explain in one sentence, because the category doesn't quite exist yet.
  There's real science or real engineering here, the kind that takes years to
  replicate. We're in Europe. It's early, maybe pre-product, and the people who get
  it immediately are usually engineers who have hit this exact wall themselves.

stage_max: series-a
cheque: [500_000, 15_000_000]

must_have: []
exclude:
  - agency
  - reseller

hard_signals:
  - Technically deep, particularly infrastructure, foundation models or deep tech
  - Early enough that the category is not yet well defined
  - European, whether Western or Emerging Europe

# Earlybird deliberately moves before a category exists, so an unusually
# high weight on the founder and a low tolerance for anything already covered.
weights:
  founder_quality: 0.30
  thesis_fit: 0.30
  is_building: 0.20
  timing: 0.15
  reachable: 0.05
  too_late: 0.35

report_fields:
  - key: startup_name
    label: "Startup name"
  - key: based_in
    label: "Based in"
    hint: "City and country"
  - key: website
    label: "Website"
  - key: founded_in
    label: "Founded in"
    hint: "Month and year"
  - key: founders
    label: "Founders' names and contact info"
    hint: "LinkedIn and email are sufficient"
  - key: category
    label: "Category"
    hint: "What this is, in plain words. If it is hard to name, say so; that is often the point."
  - key: technical_moat
    label: "Technical moat"
    hint: "The hard part, and why it stays hard"
  - key: description
    label: "Description"
    hint: "Company, stage, product, clients, round, valuation cap, investors, earlier rounds"
  - key: fit
    label: "Your input"
    hint: "Why this is aligned with the investment focus"
  - key: raising_now
    label: "Are they currently raising?"
    type: yes_no
  - key: raising_when
    label: "If not, when are they going to start raising?"
    only_if: 'raising_now == "N"'
  - key: geographic_focus
    label: "Geographic focus"
    hint: "Which Earlybird vehicle fits: West, East or Health"
