[project]
name = "vc-alpha-signal-finder"
version = "0.1.0"
description = "An evaluation engine for early-stage venture. Runs locally; your deal flow never leaves your machine."
license = { file = "LICENSE" }
keywords = ["venture capital", "deal sourcing", "startup discovery"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "litellm>=1.100.1",
    "psutil>=7.2.2",
]

[project.optional-dependencies]
# installed only when the stages that need them are built
enrich = ["scrapling>=0.3", "crawl4ai>=0.4"]
sheets = ["google-api-python-client>=2.150", "google-auth>=2.35"]
reddit = ["praw>=7.7"]
dev = ["pytest>=8.0"]

[project.scripts]
vc-alpha = "vc_alpha.app.main:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The C++ extension is built separately by scripts/build_ext.py rather than at
# install time. Requiring a compiler to install a deal-sourcing tool would lose
# most of the people meant to use it, and fastpath.py falls back to pure Python
# transparently when the extension is absent.

[tool.hatch.build.targets.wheel]
packages = ["vc_alpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
